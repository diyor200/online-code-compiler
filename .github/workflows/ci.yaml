name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout out code
        uses: actions/checkout@v4

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cache go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install deps
        run: go mod download

      - name: Vet (static analysis)
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  docker:
    runs-on: ubuntu-22.04
    needs: build
    environment: Prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
              ${{ secrets.DOCKER_USERNAME }}/online-compiler:latest
              ${{ secrets.DOCKER_USERNAME }}/online-compiler:${{ github.sha }}

  deploy:
    runs-on: ubuntu-22.04
    needs: docker
    environment: Prod

    steps:
      - name: Deploy to AWS via ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            echo "Login to Docker ..."
            echo "${{ secrets.DOCKER_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            echo "Pulling the latest image ..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/online-compiler:latest
            
            echo "Removing running container ..."
            docker stop online-compiler || true
            docker rm online-compiler || true
            
            echo "Launching container ..."
            docker run --name online-compiler \
              -p ${{ secrets.HTTP_PORT }}:${{ secrets.HTTP_PORT }} \
              -e HTTP_PORT=${{ secrets.HTTP_PORT }} \
              -e HTTP_HOST=${{ secrets.HTTP_HOST }} \
              -v /var/run/docker.sock:/var/run/docker.sock \
              online-compiler:latest
